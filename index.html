<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web Camera Modern</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Layar Kamera */
        #camera-container {
            flex: 1;
            position: relative;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(1); /* Default, diubah ke -1 jika kamera depan */
        }

        /* Overlay UI */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Agar tidak menghalangi klik */
            z-index: 10;
            background: linear-gradient(to bottom, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 20%, rgba(0,0,0,0) 80%, rgba(0,0,0,0.4) 100%);
        }

        /* Area Tombol Bawah */
        .controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 30px 20px 40px 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 20;
        }

        .btn-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: transform 0.2s, background 0.2s;
            pointer-events: auto;
        }

        .btn-circle:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.5);
        }

        .btn-circle img {
            width: 28px;
            height: 28px;
        }

        .btn-capture {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #fff;
            border: 4px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
        }

        .btn-capture:active {
            background: #ddd;
        }

        /* Efek Flash saat Capture */
        #flash-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 30;
            transition: opacity 0.2s;
        }

        .loading-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 5px solid #fff;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            z-index: 5;
        }

        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="camera-container">
        <div id="loading-spinner" class="loading-spinner"></div>
        <video id="video" autoplay playsinline muted></video>
        <div class="overlay"></div>
        <div id="flash-overlay"></div>
        
        <div class="controls">
            <!-- Tombol Switch Kamera -->
            <div class="btn-circle" id="switch-btn">
                <img src="https://api.iconify.design/ic/round-flip-camera-ios.svg?color=white" alt="Switch">
            </div>
            
            <!-- Tombol Capture -->
            <div class="btn-circle btn-capture" id="capture-btn"></div>
            
            <!-- Tombol Download/Result (Hidden awalnya) -->
            <div class="btn-circle" id="download-btn" style="opacity: 0.5; pointer-events: none;">
                <img src="https://api.iconify.design/ic/round-download.svg?color=white" alt="Download">
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const switchBtn = document.getElementById('switch-btn');
        const captureBtn = document.getElementById('capture-btn');
        const downloadBtn = document.getElementById('download-btn');
        const flashOverlay = document.getElementById('flash-overlay');
        const loadingSpinner = document.getElementById('loading-spinner');

        let currentStream = null;
        let currentFacingMode = 'environment'; // Default ke kamera belakang
        let imageCaptureUrl = null;

        // Fungsi untuk menghentikan semua track dari stream sebelumnya (PENTING!)
        function stopCurrentStream() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => {
                    track.stop();
                    console.log("Track stopped:", track.kind);
                });
            }
        }

        // Fungsi utama untuk menyalakan kamera
        async function startCamera(facingMode) {
            loadingSpinner.style.display = 'block';
            stopCurrentStream(); // Selalu hentikan kamera lama sebelum memulai yang baru

            try {
                const constraints = {
                    video: {
                        facingMode: { ideal: facingMode } // Gunakan ideal agar tidak error jika kamera tidak ada
                    },
                    audio: false
                };

                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;

                // Jika kamera depan, mirror videonya
                if (facingMode === 'user') {
                    video.style.transform = 'scaleX(-1)';
                } else {
                    video.style.transform = 'scaleX(1)';
                }

                currentFacingMode = facingMode;
                loadingSpinner.style.display = 'none';
            } catch (err) {
                console.error("Error accessing camera:", err);
                alert("Gagal mengakses kamera. Pastikan Anda memberikan izin dan menggunakan HTTPS.");
                loadingSpinner.style.display = 'none';
            }
        }

        // Event Listener untuk Tombol Switch Kamera
        switchBtn.addEventListener('click', () => {
            const newFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
            startCamera(newFacingMode);
        });

        // Event Listener untuk Tombol Capture
        captureBtn.addEventListener('click', () => {
            // Efek Flash
            flashOverlay.style.opacity = '1';
            setTimeout(() => {
                flashOverlay.style.opacity = '0';
            }, 200);

            // Capture gambar ke Canvas
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const context = canvas.getContext('2d');

            // Jika kamera depan, balik gambar saat di-draw di canvas agar sama dengan tampilan video
            if (currentFacingMode === 'user') {
                context.translate(canvas.width, 0);
                context.scale(-1, 1);
            }

            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Ubah ke URL gambar
            imageCaptureUrl = canvas.toDataURL('image/jpeg', 0.8);

            // Aktifkan tombol download
            downloadBtn.style.opacity = '1';
            downloadBtn.style.pointerEvents = 'auto';
            
            // Animasi tombol capture
            captureBtn.style.background = '#bbb';
            setTimeout(() => captureBtn.style.background = '#fff', 200);
        });

        // Event Listener untuk Tombol Download
        downloadBtn.addEventListener('click', () => {
            if (imageCaptureUrl) {
                const link = document.createElement('a');
                link.href = imageCaptureUrl;
                link.download = `captured_photo_${Date.now()}.jpg`;
                link.click();
            }
        });

        // Mulai kamera saat halaman pertama kali dimuat
        // Default mencari kamera belakang ('environment')
        startCamera('environment');
    </script>
</body>
</html>
</!DOCTYPE>
